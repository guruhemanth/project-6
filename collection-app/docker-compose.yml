# ==============================================================================
# 🕉 Vinayaka Chavithi Chandas Collection Platform - Docker Compose Orchestration
# ==============================================================================
# Services:
#   1. db     - PostgreSQL 16 Alpine with persistent volume & auto-init SQL
#   2. server - Express.js REST API, JWT Auth & Socket.io Real-Time Server
#   3. client - React 18 SPA built with Vite & served via Nginx Alpine Reverse Proxy
# ==============================================================================

networks:
  chandas-network:
    driver: bridge
    name: chandas-network

volumes:
  pgdata:
    name: chandas-pgdata
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: chandas-db
    restart: unless-stopped
    networks:
      - chandas-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collection_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collection_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Backend REST API & Real-Time Socket.io Service (Node.js 20 Express)
  # ----------------------------------------------------------------------------
  server:
    image: chandas-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - chandas-network
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-collection_db}
      JWT_SECRET: ${JWT_SECRET:-govindanagar_chavithi_2026_secret_key}
      CLIENT_ORIGIN: "*"
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # 3. Frontend Web Application & Nginx Reverse Proxy (React SPA + Nginx Alpine)
  # ----------------------------------------------------------------------------
  client:
    image: chandas-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chandas-client
    restart: unless-stopped
    networks:
      - chandas-network
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
