version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: chandas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collection_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collection_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Express & Socket.io Backend API
  server:
    image: chandas-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chandas-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/collection_db
      PORT: 5000
      JWT_SECRET: govindanagar_chavithi_2026_secret_key
      CLIENT_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # 3. React Frontend + Nginx Web Server
  client:
    image: chandas-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chandas-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
    driver: local
