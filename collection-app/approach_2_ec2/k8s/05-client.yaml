apiVersion: v1
kind: Service
metadata:
  name: chandas-client-service
  namespace: chandas
  labels:
    app.kubernetes.io/name: chandas-client
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: chandas-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chandas-client
  namespace: chandas
  labels:
    app.kubernetes.io/name: chandas-client
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chandas-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chandas-client
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: client
          image: chandas-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
